name: Calco
options:
  bundleIdPrefix: dev.plazoleta
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "2"   # iPad only
targets:
  Calco:
    type: application
    platform: iOS
    sources: [Calco]
    info:
      path: Calco/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Calco Project
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.plazoleta.calco.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.plazoleta.calco.project
            UTTypeDescription: Calco Project
            UTTypeConformsTo: [com.apple.package, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [calco]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.plazoleta.calco
        INFOPLIST_KEY_CFBundleDisplayName: Calco
  CalcoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalcoTests]
    dependencies:
      - target: Calco
