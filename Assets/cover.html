<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Repository cover / GitHub social preview (1280x640): the app icon, the name and the app on Calco's
     dark Estudio background with its amber accent. Rendered into cover.png by scripts/make-cover.sh. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #f1efe8; position: relative;
    background:
      radial-gradient(900px 600px at 105% 105%, rgba(239, 159, 39, .34), transparent 62%),
      radial-gradient(700px 500px at -10% -20%, rgba(239, 159, 39, .16), transparent 60%),
      linear-gradient(135deg, #141416 0%, #1c1c1e 60%, #19160f 100%);
  }
  .brand { position: absolute; left: 76px; top: 86px; width: 540px; }
  .icon { width: 132px; height: 132px; display: block; border-radius: 30px; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .5)); }
  h1 { font-size: 92px; line-height: 1; letter-spacing: -2.5px; margin-top: 34px; font-weight: 800; }
  .tag { font-size: 32px; line-height: 1.3; margin-top: 22px; color: #fac775; font-weight: 500; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 34px; white-space: nowrap; }
  .chip { font-size: 17px; padding: 6px 13px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: #f1efe8; }
  /* iPad frame: no title bar, a thin dark bezel instead. */
  .shot {
    position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 26px; overflow: hidden;
    padding: 12px; background: #050505;
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14);
  }
  .shot img { display: block; width: 100%; border-radius: 14px; }
</style>
</head>
<body>
  <div class="brand">
    <img class="icon" src="../Calco/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="Calco icon">
    <h1>Calco</h1>
    <p class="tag">Hand-drawn sprite animation.<br>Built for game engines.</p>
    <div class="chips">
      <span class="chip">Open source</span><span class="chip">Apple Pencil</span><span class="chip">Unity</span><span class="chip">Godot</span><span class="chip">iPad</span>
    </div>
  </div>
  <div class="shot">
    <img src="screenshot.jpg" alt="Calco">
  </div>
</body>
</html>
