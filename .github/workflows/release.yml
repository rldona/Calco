# Publishes a release when a tag vX.Y.Z is pushed:
#   1. checks the tag has a CHANGELOG.md section,
#   2. runs the tests,
#   3. builds the app for iPad without signing it (no Apple Developer Program needed),
#   4. creates the GitHub release with that changelog section and the binaries:
#      Calco-X.Y.Z-unsigned.ipa and calco-unity-X.Y.Z.zip.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version and release notes
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A version with a suffix (1.0.0-beta.1) is a prerelease.
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          scripts/ci/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          SIM="$(scripts/ci/pick-simulator.sh)"
          xcodebuild test -project Calco.xcodeproj -scheme Calco -destination "id=$SIM" \
            -derivedDataPath build/dd-test CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log | grep -E "error:|Test Suite 'All tests'|Executed [0-9]+ tests" || true
          grep -q "Test Suite 'All tests' passed" build/test.log

      - name: Build the unsigned .ipa
        run: |
          set -o pipefail
          V="${{ steps.version.outputs.version }}"
          xcodebuild build \
            -project Calco.xcodeproj -scheme Calco -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-release \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          # An .ipa is a zip with the app inside a Payload folder.
          mkdir -p build/ipa/Payload dist
          cp -R build/dd-release/Build/Products/Release-iphoneos/Calco.app build/ipa/Payload/
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/dist/Calco-$V-unsigned.ipa" Payload)

      - name: Package calco-unity
        run: |
          V="${{ steps.version.outputs.version }}"
          zip -qr "dist/calco-unity-$V.zip" calco-unity

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo
            echo "- **iPad**: \`Calco-$V-unsigned.ipa\` isn't signed. Install it from Xcode over USB (see the [README](https://github.com/rldona/Calco#building)) or sign it with your own Apple ID in a sideloading tool."
            echo "- **Unity**: unzip \`calco-unity-$V.zip\` into your project's \`Packages\` folder."
            echo "- **Manual**: https://rldona.github.io/Calco/"
          } > "$RUNNER_TEMP/release.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Calco $V" \
            --notes-file "$RUNNER_TEMP/release.md" \
            $([ "${{ steps.version.outputs.prerelease }}" = "true" ] && echo --prerelease)
