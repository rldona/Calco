# Publishes a release when a tag vX.Y.Z is pushed:
#   1. checks the tag has a CHANGELOG.md section,
#   2. runs the tests,
#   3. archives the app signed for App Store Connect and uploads it to TestFlight,
#   4. creates the GitHub release with that changelog section and the binaries:
#      Calco-X.Y.Z.ipa, Calco-X.Y.Z-dSYMs.zip and calco-unity-X.Y.Z.zip.
# Signing secrets are described in docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 7RFK3DNFPT
    steps:
      - uses: actions/checkout@v4

      - name: Version and release notes
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # A version with a suffix (1.0.0-beta.1) is a prerelease.
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          scripts/ci/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Check the signing secrets
        env:
          CERT: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          for name in CERT CERT_PASSWORD KEY_ID ISSUER_ID KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. See docs/releasing.md."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Test
        run: |
          set -o pipefail
          SIM="$(scripts/ci/pick-simulator.sh)"
          xcodebuild test -project Calco.xcodeproj -scheme Calco -destination "id=$SIM" \
            -derivedDataPath build/dd-test CODE_SIGNING_ALLOWED=NO \
            | tee build-test.log | grep -E "error:|Test Suite 'All tests'|Executed [0-9]+ tests" || true
          grep -q "Test Suite 'All tests' passed" build-test.log

      - name: Install the distribution certificate and API key
        env:
          CERT: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          # altool and xcodebuild look for the key here.
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey_$KEY_ID.p8

      - name: Archive
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Calco.xcodeproj -scheme Calco -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Calco.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Export the .ipa
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Calco.xcarchive \
            -exportOptionsPlist scripts/ci/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)"
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          mv build/export/*.ipa "dist/Calco-$V.ipa"
          (cd build/Calco.xcarchive && zip -qr "$GITHUB_WORKSPACE/dist/Calco-$V-dSYMs.zip" dSYMs)

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "dist/Calco-${{ steps.version.outputs.version }}.ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Package calco-unity
        run: |
          V="${{ steps.version.outputs.version }}"
          zip -qr "dist/calco-unity-$V.zip" calco-unity

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo
            echo "- **iPad**: build ${{ steps.version.outputs.build }} is on TestFlight. \`Calco-$V.ipa\` is signed for App Store Connect."
            echo "- **Unity**: unzip \`calco-unity-$V.zip\` into your project's \`Packages\` folder."
            echo "- **Manual**: https://rldona.github.io/Calco/"
          } > "$RUNNER_TEMP/release.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Calco $V" \
            --notes-file "$RUNNER_TEMP/release.md" \
            $([ "${{ steps.version.outputs.prerelease }}" = "true" ] && echo --prerelease)

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf ~/private_keys
